name: Deploy article files
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Upload via FTP
        env:
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASS }}
        run: |
          curl --ftp-pasv --ftp-create-dirs -T "files/blog/how-to-open-avif-files/index.html" "ftp://$FTP_USER:$FTP_PASS@45.130.228.16/blog/how-to-open-avif-files/index.html"
          curl --ftp-pasv --ftp-create-dirs -T "files/blog/how-to-open-avif-files/hero.jpg" "ftp://$FTP_USER:$FTP_PASS@45.130.228.16/blog/how-to-open-avif-files/hero.jpg"
          curl --ftp-pasv -T "files/blog/index.html" "ftp://$FTP_USER:$FTP_PASS@45.130.228.16/blog/index.html"
          curl --ftp-pasv -T "files/sitemap.xml" "ftp://$FTP_USER:$FTP_PASS@45.130.228.16/sitemap.xml"
